<!doctype html><html lang="nb"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><meta name="description" content="Arkitektkontor på Tåsen for boliger, hytter, tilbygg og renovering."><title>Vemund L. Isum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap">
<style id="site-css">
/* Layout: three columns (sticky logo 25vw | portrait carousel image | project info 25vw), vw-based type, rotated edge buttons, light grey office band, bold fixed footer stripe. Single light look by design. */
:root{
  --bg:#ffffff; --fg:#000000; --grey:#808080; --line:#dddddd; --red:#c1240f; --link:#0000ee;
  --office:#e8e8e6; --hover-blue:#6a81d7; --hover-yellow:#f3cd25; --ph:#ececec;
  --sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --serif:"EB Garamond",Garamond,"Times New Roman",serif;
  --fs-logo:6vw; --fs-title:3vw; --fs-body:1.5vw; --fs-small:1.2vw; --fs-footer:1.2vw;
  --m:max(16px,2vw); --gap:2.5vw;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px}
p{margin-top:0}
a{color:var(--fg);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--sans);color:var(--fg);cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
img{display:block;max-width:100%}
.sr{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important}

/* temasider (category strip) */
.temasider{display:grid;grid-template-columns:repeat(auto-fill,minmax(15vw,1fr));gap:2vw;margin-inline:var(--m);position:sticky;top:env(safe-area-inset-top,0px);z-index:1000;font-size:var(--fs-body);font-weight:300;height:min-content}
.temasider a{display:block;background:#ffffff94;border-radius:15px;padding:0 1vw 0 .5vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.temasider a[aria-current="true"]{text-decoration:underline}
.banner{margin:1vh var(--m) 0;font-size:var(--fs-small);font-weight:300;color:var(--grey)}

.container{width:100%;padding-top:5.5vh;padding-bottom:5vh}
.three-column{display:flex;width:calc(100% - 2*var(--m));margin-inline:var(--m);gap:var(--gap)}
.left-column{position:relative;width:25vw;flex-shrink:0}
.logo{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--fs-body)*1.6 + 1vw);font-size:calc(var(--fs-logo)*.5);font-weight:700;line-height:1.15;z-index:900}
.logo a{display:block}
.logo-line{display:block;width:max-content;white-space:nowrap}
.logo a:hover{text-decoration:none}
.logo-tagline{font:500 var(--fs-small)/1.3 var(--serif);margin:1.5vh 0 0}

/* carousel */
.carousel{position:relative;overflow:hidden;flex:1;min-width:0;touch-action:pan-y}
.carousel-wrapper{display:flex;transition:transform .5s ease-in-out}
.slide{flex:0 0 100%;min-width:100%;display:flex;overflow:hidden;color:var(--fg)}
.slide:hover{text-decoration:none}
.center-column{flex:1;min-width:0;overflow:hidden;max-height:90vh;margin-right:2vw}
.project-image{width:100%;aspect-ratio:3/4;object-fit:cover;transition:transform .3s ease-in-out}
.slide:hover .project-image{transform:scale(1.05)}
.slide:hover .project-title{text-decoration:underline}
.right-column{width:25vw;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start}
.project-title{font-size:var(--fs-title);font-weight:500;margin:0 0 1rem;line-height:1.15;padding-right:5vw}
.project-meta{font-size:var(--fs-body);font-weight:300;margin:0}
.project-year{margin-top:2.5rem}
.carousel-number{position:absolute;right:0;top:0;font-size:var(--fs-body);font-weight:300;line-height:1.3;z-index:5}
.carousel-button{position:absolute;top:50%;transform:translateY(-50%);background:transparent;border:0;padding:0;font-size:32px;z-index:6;color:var(--fg)}
.carousel-button:hover{color:var(--grey)}
.carousel-button.left{left:.5vw}
.carousel-button.right{left:calc(100% - 25vw - 2vw - 1.4em)}
.ph{width:100%;aspect-ratio:3/4;background:var(--ph);color:#9a9a9a;display:flex;align-items:center;justify-content:center}
.ph svg{width:80%;height:auto}

/* rotated edge buttons */
.rail{position:fixed;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;background:none;border:0;padding:0;font-size:var(--fs-body);font-weight:400;line-height:1.3;z-index:1100;color:var(--fg)}
.rail:hover{text-decoration:underline}
.rail.left{left:0}
.rail.right{right:0}
.rail.kontakt{display:none}
.rail.pillar:hover{text-decoration:none}
.rail.pillar a:hover{text-decoration:underline}

/* thumbnail grid */
.thumbnail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15vw,1fr));gap:2vw;margin:8vw var(--m) 2vw;grid-auto-flow:dense}
.thumbnail-item{display:block;position:relative;min-width:0}
.thumbnail-item:hover{text-decoration:none}
.thumb-wrap{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;background:var(--ph)}
.thumb-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .1s ease,transform .1s ease}
.thumb-wrap .hov{opacity:0}
.thumbnail-item:hover .thumb-wrap .base{opacity:0;transform:scale(1.02)}
.thumbnail-item:hover .thumb-wrap .hov{opacity:1;transform:scale(1.05)}
.thumbnail-item:hover .thumb-wrap .only{transform:scale(1.05)}
.thumb-wrap .ph{position:absolute;inset:0;aspect-ratio:auto;height:100%}
.thumbnail-info{margin-top:1vw}
.thumbnail-title{font-size:var(--fs-footer);font-weight:700;margin:1vh 0 .5rem}
.thumbnail-item:hover .thumbnail-title{text-decoration:underline}
.thumb-meta{font-size:var(--fs-footer);font-weight:300;margin:0}
.grid-mood{grid-column:span 2;grid-row:span 2;position:relative;overflow:hidden;min-width:0}
.grid-mood img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.empty{font-size:var(--fs-body);font-weight:300;color:var(--grey);margin:8vw var(--m) 2vw}

/* office section */
.office-section{margin-top:10vh;background:var(--office);color:var(--fg);padding-bottom:6vw;scroll-margin-top:0}
.office-text{font:300 var(--fs-small)/1.3 var(--serif);text-align:left}
.office-section .office-text{font-family:var(--sans)}
.office-text :where(*){font:inherit}
.office-text p{margin:0 0 1.5rem}
.office-text .hero-title{font-size:calc(var(--fs-small)*1.8);font-weight:600;line-height:1.1;margin:2vw 0 0}
.office-text h3:not(.hero-title),.office-text b{font-weight:500}
.office-text h3{margin:1.2rem 0}
.office-section a{color:var(--fg);display:block;margin-bottom:2vh}
.office-section .left-column{width:25vw}
.office-center{flex:1;min-width:0;margin-right:2vw}
.office-image{display:flex;overflow-x:auto;overflow-y:hidden;max-height:61vh;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-color:#9a9a9a transparent}
.office-card{display:flex;flex-direction:column;flex:0 0 auto;scroll-snap-align:center}
.office-card img{max-height:52vh;width:auto;margin:2vw 1vw .5vw 0}
.office-card p{font:italic 300 var(--fs-footer)/1.3 var(--sans);margin:0}
.office-section .right-column{width:25vw;margin-top:2vw}
.office-section .right-column p{margin:0 0 1.5rem}

/* footer stripe */
.bottom-border{position:fixed;z-index:1000;background:var(--bg);left:0;bottom:0;padding:0 var(--m) env(safe-area-inset-bottom,0px);width:100%;font-size:var(--fs-footer);font-weight:700;display:flex;align-items:baseline}
.bottom-border span,.bottom-border a{display:block;padding-block:.3em}
.contacts{width:48vw;display:inline-flex;justify-content:space-between;gap:1em}
.copy{margin-left:auto}

/* overlays */
.overlay-backdrop{position:fixed;inset:0;background:transparent;z-index:9998}
.overlay{position:fixed;top:0;left:0;width:50%;height:100%;background:var(--bg);z-index:9999;filter:drop-shadow(2px 4px 10px gray);animation:inL .25s ease-out}
.overlay.right{left:auto;right:0;animation-name:inR}
@keyframes inL{from{transform:translateX(-12px);opacity:0}}
@keyframes inR{from{transform:translateX(12px);opacity:0}}
.overlay-content{position:relative;font-weight:300;font-size:var(--fs-small);height:100%;overflow-y:auto;padding:5.5vh var(--m)}
.overlay-close{position:absolute;top:12px;border:0;background:transparent;font-size:28px;line-height:1;z-index:2}
.overlay:not(.right) .overlay-close{right:var(--m)}
.overlay.right .overlay-close{left:var(--m)}
.archive-table{width:100%;border-collapse:collapse;margin-top:20px;line-height:1.8}
.archive-table td{padding:10px;text-align:left;border-bottom:1px solid var(--line);color:#333;vertical-align:top}
.archive-table td a{display:block;color:var(--link)}
.archive-table td:first-child{width:40%;word-spacing:1vw;color:var(--grey)}
.archive-table td:nth-child(2){width:10%}
.archive-table td:nth-child(3){width:30%;color:var(--grey)}
.archive-table td:last-child{width:20%;color:var(--grey)}
.archive-table tr:hover{background:var(--hover-blue)}
.archive-table tr:hover td a{color:#fff;text-decoration:underline}
.nyheter-table{line-height:2}
.nyheter-table td:first-child{width:20%;word-spacing:normal}
.nyheter-table td:nth-child(2){width:80%;color:#333}
.nyheter-table td a{display:inline}
.nyheter-table tr:hover{background:var(--hover-yellow)}
.updated{margin-top:2rem;color:var(--grey)}

/* project page */
.prosjektside .left-column{width:16vw}
.prosjektside .center-col{width:70vw;flex-shrink:0}
.prosjektside .right-col{width:3vw;flex-shrink:0}
.prosjekt-cover img{max-width:70vw;max-height:92vh;width:auto;height:auto;margin-left:0}
.prosjekt-cover .ph{max-width:70vw;max-height:92vh;aspect-ratio:4/3;margin-left:0}
.prosjekt-tekst{margin:3vh 0 5vh}
.prosjekt-tekst h1{font-size:var(--fs-title);font-weight:500;margin:0 0 1rem;line-height:1.15}
.prosjekt-tekst p{font-size:var(--fs-body);font-weight:300;margin:0}
.galleri{display:flex;flex-direction:column;align-items:flex-start;gap:0;margin-left:calc(var(--m) + 18.5vw);margin-right:var(--m)}
.bilde{margin:0 0 3vh;width:min-content}
.bilde img{max-width:70vw;max-height:92vh;width:auto;height:auto}
.bilde h4{font-size:var(--fs-title);font-weight:500;margin:1.5vh 0 0}
.bilde p{font-size:var(--fs-body);font-weight:300;margin:.3vh 0 0;min-width:20vw}
.galleri .office-text{width:45vw;font-size:var(--fs-body);margin:2vw 0;align-self:flex-start;max-width:100%}
.galleri .office-text a{color:var(--link)}
.related{padding-bottom:4vw}

/* edit button */
.edit-pill{position:fixed;right:var(--m);bottom:calc(env(safe-area-inset-bottom,0px) + 3rem);z-index:1200;background:#000;color:#fff;border:0;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.edit-pill .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--hover-yellow);margin-right:7px;vertical-align:1px}

/* ---------- tablet ---------- */
@media (max-width:1050px){
  :root{--fs-body:2vw;--fs-small:1.5vw;--fs-footer:1.75vw}
  .temasider{position:fixed;top:calc(env(safe-area-inset-top,0px) + 1vh);left:var(--m);right:var(--m);margin:0}
  .container{padding-top:calc(5.5vh + 3vw)}
  .carousel-button{display:none!important}
  .carousel-number{font-weight:700}
  .bottom-border{display:block}
  .contacts{width:100%}
  .copy{margin-left:0}
  .office-card img{max-height:35dvh;padding-bottom:2vh}
}

/* ---------- phone ---------- */
@media (max-width:800px){
  :root{--fs-logo:10vw;--fs-title:8vw;--fs-body:5vw;--fs-small:3vw;--fs-footer:.95rem}
  .temasider{position:fixed;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 3.5rem);left:var(--m);right:var(--m);display:flex;gap:2vw;flex-wrap:nowrap;overflow-x:auto;font-size:var(--fs-footer);scrollbar-width:none}
  .temasider::-webkit-scrollbar{display:none}
  .temasider a{flex:0 0 auto;max-width:50vw;background:#ffffffc7;border-radius:12px;padding:.15rem 2.5vw;box-shadow:0 0 0 1px #0000000f}
  .banner{margin-top:calc(env(safe-area-inset-top,0px) + 3.2rem)}
  .container{padding-top:calc(env(safe-area-inset-top,0px) + 3.2rem);padding-bottom:7rem}
  .three-column{flex-direction:column;align-items:stretch;margin-top:1vh;gap:0}
  .left-column,.office-section .left-column,.prosjektside .left-column{width:100%}
  .logo{position:relative;top:auto;margin:0 0 2vh;font-size:7vw}
  .logo-tagline{display:none}
  .slide{flex-direction:column}
  .center-column{margin-right:0;max-height:none;margin-bottom:3vh}
  .right-column{width:100%}
  .project-title{padding-right:0}
  .project-year{margin-top:2vh}
  .carousel-number{top:.5vh;left:10px;right:auto;background:#35353557;color:#fff;padding:2px 6px;font-size:var(--fs-footer)}
  .rail{writing-mode:horizontal-tb;transform:none;top:calc(env(safe-area-inset-top,0px) + 1vh);background:#ffffffba;border-radius:18px;padding:2px 10px;font-size:var(--fs-footer);white-space:nowrap}
  .rail.left{left:auto;right:calc(var(--m) + 11.4rem)}
  .rail.right{right:var(--m)}
  .rail.kontakt{display:block;right:calc(var(--m) + 5.7rem)}
  .rail.left.back{left:var(--m);right:auto}
  .rail.pillar{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 3.5rem);left:var(--m);right:var(--m);overflow-x:auto}
  .rail.pillar a{display:inline;margin-left:.6em}
  .thumbnail-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:3vw;margin-top:10vw}
  .thumb-wrap{aspect-ratio:4/5}
  .thumbnail-title{font-weight:600;margin-bottom:.5vh}
  .thumbnail-title,.thumb-meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .office-section{display:flex;flex-direction:column;margin-top:10vh;padding-bottom:9rem}
  .office-section .three-column{display:flex;flex-direction:column}
  .office-section .left-column{order:1}
  .office-section .right-column{order:2;width:100%;margin-top:0}
  .office-center{order:3;margin-right:0}
  .office-text{font-size:var(--fs-body)}
  .office-text .hero-title{font-size:calc(var(--fs-body)*1.8)}
  .office-card img{max-height:30vh;margin:2vw 2vw 2vw 0}
  .bottom-border{padding:.4rem var(--m) calc(env(safe-area-inset-bottom,0px) + .4rem)}
  .bottom-border span,.bottom-border a{padding:0}
  .contacts{flex-wrap:wrap}
  .overlay{width:100%}
  .overlay-content{padding-top:calc(env(safe-area-inset-top,0px) + 4rem)}
  .overlay .overlay-close{top:calc(env(safe-area-inset-top,0px) + 1rem)}
  .archive-table td:first-child{word-spacing:normal}
  .prosjektside .center-col,.prosjektside .right-col{width:100%}
  .prosjekt-cover img,.prosjekt-cover .ph{max-width:100%;max-height:100dvh}
  .galleri{margin-inline:var(--m)}
  .bilde{width:100%}
  .bilde img{max-width:100%;max-height:100dvh}
  .galleri .office-text{width:100%;margin:2vh 0}
  .edit-pill{bottom:calc(env(safe-area-inset-bottom,0px) + 6.5rem)}
}

/* zoomable images, sub-projects, lightbox */
.prosjekt-cover img[data-zoom],.bilde img[data-zoom]{cursor:zoom-in}
.prosjekt-tekst .overordnet{margin-top:1rem}
.prosjekt-tekst .overordnet a{text-decoration:underline}
.delprosjekter{margin:0 var(--m) 7vh calc(var(--m) + 18.5vw);width:70vw}
.delprosjekter h2{font-size:var(--fs-body);font-weight:500;margin:0 0 1.5vw}
.delprosjekter .thumbnail-grid{margin:0;grid-template-columns:repeat(3,minmax(0,1fr))}
.delprosjekter .thumb-wrap{aspect-ratio:4/3}
.lb{position:fixed;inset:0;z-index:10000;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;outline:none;animation:lbin .18s ease-out}
@keyframes lbin{from{opacity:0}}
.lb.drag{cursor:grabbing}
.lb img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;max-height:none;will-change:transform;-webkit-user-drag:none}
.lb button{position:absolute;background:none;border:0;color:var(--fg);font-size:34px;line-height:1;padding:14px 18px;z-index:2;cursor:pointer}
.lb button:hover{color:var(--grey)}
.lb .x{top:max(6px,env(safe-area-inset-top,0px));right:max(6px,env(safe-area-inset-right,0px))}
.lb .p{left:6px;top:50%;transform:translateY(-50%)}
.lb .n{right:6px;top:50%;transform:translateY(-50%)}
.lb .cap{position:absolute;left:var(--m);right:var(--m);bottom:calc(env(safe-area-inset-bottom,0px) + .7rem);display:flex;justify-content:space-between;gap:2em;font-size:var(--fs-small);font-weight:300;pointer-events:none;z-index:2}
.lb .cap span{background:#ffffffc7;padding:.1em .5em}
.lb .zhint{position:absolute;top:calc(env(safe-area-inset-top,0px) + 1rem);left:var(--m);font-size:var(--fs-small);font-weight:300;color:var(--grey);pointer-events:none}
@media (hover:none){.lb .zhint{display:none}}
@media (max-width:1050px){.delprosjekter{margin-left:var(--m);width:auto}.galleri{margin-left:var(--m)}}
@media (max-width:800px){
  .prosjekt-cover img,.prosjekt-cover .ph{max-width:100%}
  .delprosjekter{margin:0 var(--m) 5vh;width:auto}
  .delprosjekter .thumbnail-grid{grid-template-columns:1fr;gap:5vw}
  .delprosjekter .thumb-wrap{aspect-ratio:4/3}
  .lb .p,.lb .n{display:none}
  .lb .cap{font-size:.9rem}
}


/* ---------- new front page: top bar, large lead text, editorial project grid ---------- */
.hd{position:sticky;top:0;z-index:1000;display:flex;justify-content:space-between;align-items:flex-start;gap:3vw;padding:1.4vw var(--m);background:var(--bg)}
.hd .logo{position:static;width:clamp(120px,12.5vw,230px);flex:0 0 auto;margin:0;font-size:1.6vw}
.hd-nav{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:baseline;gap:.2em 1.6vw;font-size:max(14px,1.1vw);font-weight:400;line-height:1.5;padding-top:.1em}
.hd-nav a,.hd-nav button{background:none;border:0;padding:0;font:inherit;color:var(--fg);cursor:pointer;text-decoration:none}
.hd-nav a:hover,.hd-nav button:hover{text-decoration:underline}
.hd-nav a[aria-current="true"]{text-decoration:underline;text-underline-offset:.25em}
.hd-nav .sep{width:1px;height:.9em;background:currentColor;opacity:.35;align-self:center}
.lead{margin:9vw var(--m) 7vw}
.lead .logo-tagline{font:400 clamp(26px,3.7vw,72px)/1.1 var(--serif);max-width:64vw;margin:0;letter-spacing:-.01em}
.work{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6vw 2vw;margin:0 var(--m) 6vw;align-items:start}
.work .thumbnail-item{grid-column:span 6}
.work .thumbnail-item.feat{grid-column:1/-1}
.work .thumbnail-item.w7{grid-column:span 7}
.work .thumbnail-item.w5{grid-column:span 5}
.work .thumbnail-item.w5:nth-of-type(odd){margin-top:0}
.work .thumb-wrap{aspect-ratio:4/3}
.work .thumbnail-item.feat .thumb-wrap{aspect-ratio:2/1}
.work .thumbnail-item.w5 .thumb-wrap{aspect-ratio:4/5}
.work .thumbnail-info{display:flex;flex-wrap:wrap;align-items:baseline;gap:.15em .35em;margin-top:1.1vw}
.work .thumbnail-title{flex:1 0 100%;margin-bottom:.1em!important;font:500 var(--fs-body)/1.2 var(--sans);margin:0}
.work .thumb-meta{font-size:var(--fs-footer);font-weight:300;color:inherit}
.work .thumb-meta:empty{display:none}
.work .thumb-meta+.thumb-meta::before{content:"· ";opacity:.6}
.work .grid-mood.wide{grid-column:1/-1;grid-row:auto;aspect-ratio:21/9}
.work .thumbnail-item:hover .thumb-wrap .base{transform:none}
.office-section{padding-top:5vw;scroll-margin-top:0}
#kontakt{scroll-margin-top:8vw}
@media (max-width:1050px){
  .hd{gap:2vw}
  .hd-nav{font-size:max(13px,1.6vw)}
  .lead .logo-tagline{max-width:90vw}

/* placeholder drawing for projects without images */
function ph(p){
  var n=parseInt(String(p.nr).replace(/\D/g,""),10)||7, r=function(k){return((n*9301+k*49297)%233280)/233280;};
  var w=150+Math.round(r(1)*90),h=90+Math.round(r(2)*60),x=150-w/2,g=300,t=g-h,roof=Math.floor(r(3)*3),pk=t-30-Math.round(r(4)*45);
  var s='<svg viewBox="0 0 300 400" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2">';
  s+='<line x1="10" y1="'+g+'" x2="290" y2="'+g+'"/><rect x="'+x+'" y="'+t+'" width="'+w+'" height="'+h+'"/>';
  if(roof===0)s+='<polyline points="'+(x-8)+','+(t+4)+' 150,'+pk+' '+(x+w+8)+','+(t+4)+'"/>';
  else if(roof===1)s+='<polyline points="'+(x-6)+','+t+' '+(x-6)+','+(pk+20)+' '+(x+w+6)+','+(t-6)+'"/>';
  else s+='<line x1="'+(x-6)+'" y1="'+(t-4)+'" x2="'+(x+w+6)+'" y2="'+(t-4)+'"/>';
  var cols=2+Math.floor(r(5)*2),ww=16,gap=(w-cols*ww)/(cols+1);
  for(var i=0;i<cols;i++){var wx=x+gap+i*(ww+gap);s+='<rect x="'+wx.toFixed(1)+'" y="'+(t+18)+'" width="'+ww+'" height="'+Math.round(h*.35)+'"/>';}
  s+='<rect x="'+(x+w*.62).toFixed(1)+'" y="'+(g-38)+'" width="18" height="38"/>';
  return'<div class="ph">'+s+'</g></svg></div>';
}

var lb=null;

  lbClose(true);

  el.innerHTML='<img alt="" draggable="false"><button class="x" type="button" data-lb="x" aria-label="Lukk">×</button>'+(items.length>1?'<button class="p" type="button" data-lb="p" aria-label="Forrige bilde">←</button><button class="n" type="button" data-lb="n" aria-label="Neste bilde">→</button>':'')+
    '<div class="zhint">Rull for å zoome · dra for å flytte · Esc for å lukke</div><div class="cap"><span class="c1"></span><span class="c2"></span></div>';
  document.body.appendChild(el);document.body.style.overflow="hidden";
  lb={el:el,img:el.querySelector("img"),items:items,i:i,s:1,fit:1,max:4,x:0,y:0,nw:0,nh:0,ptr:{},n:0,moved:false,multi:false,down:null,opener:document.activeElement};
  el.addEventListener("wheel",lbWheel,{passive:false});

  el.addEventListener("click",function(e){var b=e.target.closest("[data-lb]");if(!b)return;var a=b.dataset.lb;if(a==="x")lbClose();else lbShow(lb.i+(a==="n"?1:-1));});
  document.addEventListener("keydown",lbKey);window.addEventListener("resize",lbFit);

function lbClose(silent){
  if(!lb)return;var o=lb.opener;lb.el.remove();lb=null;document.body.style.overflow=editorOpen?"hidden":"";
  document.removeEventListener("keydown",lbKey);window.removeEventListener("resize",lbFit);
  if(!silent&&o&&o.focus&&document.contains(o))o.focus();
}
function lbShow(i){
  var n=lb.items.length;lb.i=(i+n)%n;var it=lb.items[lb.i],img=lb.img;
  img.style.visibility="hidden";
  img.onload=function(){if(!lb)return;lb.nw=img.naturalWidth;lb.nh=img.naturalHeight;img.style.width=lb.nw+"px";img.style.height=lb.nh+"px";lbFit();img.style.visibility="";};
  img.src=it.src;
  lb.el.querySelector(".c1").textContent=it.alt||"";lb.el.querySelector(".c1").style.display=it.alt?"":"none";
  lb.el.querySelector(".c2").textContent=n>1?(lb.i+1)+" / "+n:"";
}
function lbFit(){
  if(!lb||!lb.nw)return;var W=lb.el.clientWidth,H=lb.el.clientHeight;
  lb.fit=Math.min((W-32)/lb.nw,(H-96)/lb.nh);lb.max=Math.max(lb.fit*6,2);lb.s=lb.fit;lb.x=0;lb.y=0;lbApply();
}
function lbApply(){
  var W=lb.el.clientWidth,H=lb.el.clientHeight,w=lb.nw*lb.s,h=lb.nh*lb.s;
  lb.x=w<=W?(W-w)/2:Math.min(0,Math.max(W-w,lb.x));
  lb.y=h<=H?(H-h)/2:Math.min(0,Math.max(H-h,lb.y));
  lb.img.style.transform="translate("+lb.x+"px,"+lb.y+"px) scale("+lb.s+")";
}
function lbZoomAt(ns,cx,cy){ns=Math.max(lb.fit,Math.min(lb.max,ns));var r=ns/lb.s;lb.x=cx-(cx-lb.x)*r;lb.y=cy-(cy-lb.y)*r;lb.s=ns;lbApply();}

function lbDist(){var k=Object.keys(lb.ptr),a=lb.ptr[k[0]],b=lb.ptr[k[1]];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
function lbDown(e){
  if(!lb||e.target.closest("button"))return;
  if(!Object.keys(lb.ptr).length){lb.moved=false;lb.multi=false;lb.down=e.target;}
  lb.ptr[e.pointerId]={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY};

}
function lbMove(e){
  if(!lb||!lb.ptr[e.pointerId])return;var p=lb.ptr[e.pointerId],dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(Object.keys(lb.ptr).length>=2){var m=lbDist();lb.x+=m.x-lb.pm.x;lb.y+=m.y-lb.pm.y;lbZoomAt(lb.s*m.d/lb.pd,m.x,m.y);lb.pd=m.d;lb.pm={x:m.x,y:m.y};lb.moved=true;return;}
  if(Math.hypot(e.clientX-p.x0,e.clientY-p.y0)>5){lb.moved=true;lb.el.classList.add("drag");}

  else if(e.key==="+"||e.key==="="){e.preventDefault();lbZoomAt(lb.s*1.4,W,H);}
  else if(e.key==="-"||e.key==="_"){e.preventDefault();lbZoomAt(lb.s/1.4,W,H);}

}

/* ---------- render + routing ---------- */
function render(keepScroll){
  var r=parseHash(), y=window.scrollY, p=r.view==="project"?byId(r.id):null;
  document.title=state.example?"Prosjektportefølje":state.site.name;
  var html=(p&&(!p.hidden||canWrite))?projectPage(p):home(r);
  if(openOv)html+=overlay(openOv);
  if(canWrite&&!editorOpen)html+='<button class="edit-pill" type="button" id="editbtn">'+(dirty?'<span class="dot"></span>':'')+'Rediger</button>';
  app.innerHTML=html;
  applyStyle();
  fitLogo();
  if(keepScroll)window.scrollTo(0,y);
  startAuto();
}
function route(){
  var r=parseHash();
  if(r.ov){openOv=r.ov;render(true);return;}
  openOv="";render(false);
  if(r.view==="project")window.scrollTo(0,0);
  else if(r.cat!==undefined){var g=document.getElementById("prosjekter");if(g)window.scrollTo(0,Math.max(0,g.getBoundingClientRect().top+window.scrollY-60));}
  else if(r.anchor&&r.anchor!=="top"){var el=document.getElementById(r.anchor);if(el)el.scrollIntoView();}
  else window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

function fontInfo(n){for(var i=0;i<FONT_LIST.length;i++)if(FONT_LIST[i][0]===n)return FONT_LIST[i];return null;}

function ensureFonts(){var st=sty(),need={};Object.keys(st).forEach(function(k){var f=st[k]&&st[k].font;if(f)need[f]=1;});

/* logo: every line is stretched with letter-spacing so all lines share the same left and right edge */
function fitLogo(){
  Array.prototype.forEach.call(document.querySelectorAll(".logo"),function(el){
    var lines=el.querySelectorAll(".logo-line");if(!lines.length)return;
    var W=el.clientWidth;if(!W)return;
    el.style.fontSize="100px";
    var ws=Array.prototype.map.call(lines,function(l){l.style.letterSpacing="0px";l.style.marginRight="0px";return l.getBoundingClientRect().width;});
    var max=Math.max.apply(null,ws);if(!max){el.style.fontSize="";return;}
    var fs=Math.floor(W/max*100*100)/100;el.style.fontSize=fs+"px";
    Array.prototype.forEach.call(lines,function(l,i){var n=Array.from(l.textContent).length,w=l.getBoundingClientRect().width;
      if(n<2)return;var ls=(W-w)/(n-1);l.style.letterSpacing=ls+"px";l.style.marginRight=(-ls)+"px";});
  });
}
var fitT=0;window.addEventListener("resize",function(){clearTimeout(fitT);fitT=setTimeout(fitLogo,80);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitLogo);

/* carousel */
function feats(){return visible().filter(function(p){return p.featured;});}
function go(i){var n=feats().length;if(!n)return;ci=((i%n)+n)%n;var w=document.getElementById("cw"),c=document.getElementById("cn");if(w){w.style.transform="translateX("+(-ci*100)+"%)";Array.prototype.forEach.call(w.children,function(a,k){if(k===ci)a.removeAttribute("tabindex");else a.setAttribute("tabindex","-1");});}if(c)c.textContent=(ci+1)+" / "+n;}
function startAuto(){clearInterval(autoTimer);if(REDUCED||editorOpen||openOv||feats().length<2||!document.getElementById("cw"))return;autoTimer=setInterval(function(){var c=document.getElementById("carousel");if(c&&!c.matches(":hover")&&!document.hidden)go(ci+1);},6000);}
var sx=null,sy=0;
app.addEventListener("pointerdown",function(e){if(e.target.closest("#carousel")){sx=e.clientX;sy=e.clientY;swiped=false;}});
app.addEventListener("pointerup",function(e){if(sx===null)return;var dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){swiped=true;go(ci+(dx<0?1:-1));startAuto();}});
app.addEventListener("pointercancel",function(){sx=null;});

app.addEventListener("click",function(e){
  var t=e.target,b;
  if(swiped&&t.closest(".slide")){e.preventDefault();swiped=false;return;}
  if((b=t.closest("[data-dir]"))){go(ci+(+b.dataset.dir));startAuto();return;}
  if((b=t.closest("[data-open]"))){openOv=b.dataset.open;render(true);return;}
  if(t.closest("[data-close]")){closeOv();return;}
  if(openOv&&t.closest(".overlay a[href^='#']")){openOv="";}
  if(t.closest("#editbtn")){openEditor();}
});
function closeOv(){openOv="";if(/^#(arkiv|nyheter)$/.test(location.hash))history.replaceState(null,"",location.pathname+location.search);render(true);}
document.addEventListener("keydown",function(e){
  if(editorOpen)return;
  if(e.key==="Escape"&&openOv){closeOv();return;}
  if(openOv||/input|textarea/i.test((e.target||{}).tagName||""))return;
  if(document.getElementById("cw")&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){go(ci+(e.key==="ArrowRight"?1:-1));startAuto();}
});

/* image handling */
function loadImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),img=new Image();img.onload=function(){res({img:img,u:u});};img.onerror=function(){URL.revokeObjectURL(u);
  var fr=new FileReader();fr.onload=function(){var i2=new Image();i2.onload=function(){res({img:i2});};i2.onerror=rej;i2.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);};img.src=u;});}
function toBlob(c){return new Promise(function(res){
  function jpg(){c.toBlob(function(b){res(b);},"image/jpeg",0.86);}
  try{c.toBlob(function(b){if(b&&b.type==="image/webp")res(b);else jpg();},"image/webp",0.86);}catch(e){jpg();}});}
function shrink(file){return loadImg(file).then(function(o){var img=o.img,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,(assetsNs?2600:1800)/Math.max(w,h)),cw=Math.round(w*s),ch=Math.round(h*s);
  var c=document.createElement("canvas");c.width=cw;c.height=ch;var x=c.getContext("2d");x.fillStyle="#ffffff";x.fillRect(0,0,cw,ch);x.drawImage(img,0,0,cw,ch);if(o.u)URL.revokeObjectURL(o.u);
  var small=Math.max(w,h)<1200;
  if(assetsNs)return toBlob(c).then(function(b){if(!b)throw new Error("blob");return assetsNs.upload(b).then(function(r){return{src:"/_blob/"+r.id,asset:r.id,alt:"",w:cw,h:ch,small:small};});});
  return{src:c.toDataURL("image/jpeg",0.8),alt:"",w:cw,h:ch,small:small};});}
function refreshAssetUse(){if(!assetsNs)return;assetsNs.list().then(function(r){assetUse=r&&r.usage||null;if(typeof updateBar==="function"&&ed&&!ed.hidden)updateBar();}).catch(function(){});}
function migrateImages(){
  if(!assetsNs){status("Bildelageret er ikke tilgjengelig i denne visningen.","err");return;}
  var all=[];state.projects.forEach(function(p){(p.images||[]).forEach(function(im){all.push(im);});});
  ["officeImages","moods"].forEach(function(k){(state.site[k]||[]).forEach(function(im){all.push(im);});});
  var todo=all.filter(function(im){return im.src&&im.src.indexOf("data:")===0;}),n=0,fail=0;
  if(!todo.length){status("Alle bilder ligger allerede i bildelageret.","ok");return;}
  ed.classList.add("busy");
  todo.reduce(function(pr,im){return pr.then(function(){status("Flytter bilde "+(++n)+" av "+todo.length+" …","warn");
    return fetch(im.src).then(function(r){return r.blob();}).then(function(b){return assetsNs.upload(b);}).then(function(r){im.src="/_blob/"+r.id;im.asset=r.id;},function(){fail++;});});},Promise.resolve()).then(function(){
    ed.classList.remove("busy");setDirty();refreshAssetUse();drawTab();
    status(fail?fail+" bilde"+(fail>1?"r":"")+" kunne ikke flyttes. Prøv igjen.":"Ferdig. "+(todo.length-fail)+" bilder er flyttet. Trykk «Lagre og publiser».",fail?"err":"ok");});
}
function refreshImgs(target){var g=ed.querySelector("#imgs-"+target);if(g)g.innerHTML=imgsHtml(target);if(target==="p")drawList();}
function addFiles(files,target){var arr=listFor(target);if(!arr||!files||!files.length)return;
  var list=Array.prototype.filter.call(files,function(f){return/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|heic)$/i.test(f.name);});
  if(!list.length){status("Bare bildefiler kan legges til.","err");return;}
  status("Behandler "+list.length+" bilde"+(list.length>1?"r":"")+" …","warn");
  var fail=0,full=0,small=0;
  list.reduce(function(pr,f){return pr.then(function(){return shrink(f).then(function(im){if(im.small)small++;delete im.small;arr.push(im);},function(e){if(e&&(e.code==="quota_or_state"||e.code==="too_large"))full++;else fail++;});});},Promise.resolve()).then(function(){
    refreshImgs(target);setDirty();refreshAssetUse();
    if(full)status("Bildelageret er fullt eller bildet er for stort. "+full+" bilde"+(full>1?"r":"")+" ble ikke lagt til.","err");
    else if(fail)status(fail+" bilde"+(fail>1?"r":"")+" kunne ikke leses. Prøv JPG eller PNG.","err");
    else if(small)status(small+" bilde"+(small>1?"r er":" er")+" lite (under 1200 px) og kan bli uskarpt på store skjermer.","warn");
    else status("","");});
}

  if((b=t.closest("[data-streset]"))){var so=sty()[b.dataset.streset];if(so){delete so[b.dataset.sp];if(!Object.keys(so).length)delete sty()[b.dataset.streset];}applyStyle();fitLogo();drawTab();setDirty(true);return;}
  if(t.closest("#st-resetall")){state.site.style={};applyStyle();fitLogo();drawTab();setDirty(true);return;}
});
ed.addEventListener("keydown",function(e){
  var fl=e.target.closest(".fp-list");
  if(e.key==="Escape"&&(fl||e.target.closest(".fpick"))){var op=ed.querySelector(".fp-list:not([hidden])");if(op){e.preventDefault();closePickers();var bb=op.parentNode.querySelector(".fp-btn");if(bb)bb.focus();}return;}
  if(fl&&(e.key==="ArrowDown"||e.key==="ArrowUp")){e.preventDefault();var opts=Array.prototype.slice.call(fl.querySelectorAll("button")),ix=opts.indexOf(e.target)+(e.key==="ArrowDown"?1:-1);if(opts[ix])opts[ix].focus();return;}var r=e.target.closest(".row,[data-drop]");if(r&&(e.key==="Enter"||e.key===" ")&&e.target===r){e.preventDefault();r.click();}});
ed.addEventListener("input",function(e){
  var t=e.target,k=t.dataset.k;
  if(t.dataset.fact){var pf=byId(sel);if(!pf||!pf.facts||!pf.facts[+t.dataset.i])return;pf.facts[+t.dataset.i][t.dataset.fact]=t.value;setDirty();return;}
  if(t.dataset.imf){var arr=listFor(t.dataset.t);arr[+t.dataset.i][t.dataset.imf]=t.value;setDirty();return;}
  if(t.dataset.n){state.news[+t.dataset.i][t.dataset.n]=t.value;setDirty();return;}
  if(t.dataset.st){var so=sty()[t.dataset.st]=sty()[t.dataset.st]||{};if(t.value)so[t.dataset.sp]=t.value;else delete so[t.dataset.sp];
    if(t.type==="range"){var lv=document.getElementById("stv-"+t.dataset.st+"-"+t.dataset.sp);if(lv)lv.textContent=t.value+(t.dataset.sp==="cols"?"":"%");}applyStyle();fitLogo();if(t.type==="color"||t.type==="range"){var cp=t.parentNode,rb=cp.querySelector("[data-streset],.def");if(rb&&rb.className==="def")rb.outerHTML='<button type="button" data-streset="'+t.dataset.st+'" data-sp="'+t.dataset.sp+'">Standard</button>';}setDirty(true);return;}
  if(t.dataset.pcat!=null){var pq=byId(sel);if(!pq)return;pq.category=Array.prototype.filter.call(ed.querySelectorAll("[data-pcat]"),function(x){return x.checked;}).map(function(x){return x.dataset.pcat;}).join(" + ");drawList();setDirty();return;}
  if(t.dataset.catI!=null)return;
  if(!k)return;
  if(tab==="nettsted"){if(k==="categories")state.site.categories=t.value.split(/\n/).map(function(x){return x.trim();}).filter(Boolean);else state.site[k]=t.value;setDirty();return;}
  var pp=byId(sel);if(!pp)return;
  pp[k]=t.type==="checkbox"?t.checked:t.value;
  if(t.type==="checkbox")drawList();
  else if(k==="title"||k==="nr"){var row=ed.querySelector('[data-sel="'+pp.id+'"] .nm');if(row)row.textContent=pp.nr+" "+(pp.title||"Uten tittel");}
  setDirty();
});
ed.addEventListener("change",function(e){var t=e.target;
  if(t.id==="p-parent"){var pq=byId(sel);if(!pq)return;if(t.value)pq.parent=t.value;else delete pq.parent;drawList();drawForm();setDirty();return;}
  if(t.id==="file"){addFiles(t.files,imgTarget);t.value="";return;}
  if(t.dataset.catI!=null){var i=+t.dataset.catI,old=t.dataset.old,nw=t.value.trim(),cl=state.site.categories;
    if(!nw){t.value=old;status("En kategori må ha et navn. Bruk «Fjern» for å slette den.","err");return;}
    if(nw===old)return;
    if(cl.some(function(x,j){return j!==i&&x.toLowerCase()===nw.toLowerCase();})){t.value=old;status("Det finnes allerede en kategori som heter «"+nw+"».","err");return;}
    cl[i]=nw;state.projects.forEach(function(p){if(hasCatOwn(p,old))p.category=kwOwn(p).map(function(k){return k.toLowerCase()===old.toLowerCase()?nw:k;}).join(" + ");});
    t.dataset.old=nw;setDirty();}
});
ed.addEventListener("dragover",function(e){var d=e.target.closest("[data-drop]");if(d){e.preventDefault();d.classList.add("over");}});
ed.addEventListener("dragleave",function(e){var d=e.target.closest("[data-drop]");if(d)d.classList.remove("over");});
ed.addEventListener("drop",function(e){var d=e.target.closest("[data-drop]");if(d){e.preventDefault();d.classList.remove("over");addFiles(e.dataTransfer.files,d.dataset.drop);}});
function nextNr(){var m=0;state.projects.forEach(function(p){var n=parseInt(p.nr,10);if(n>m)m=n;});return String(m?m+1:101);}

/* ---------- saving: republish the page with the new content ---------- */
var RESET=":root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}";
var FONTS='<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap">\n';
function buildDocument(st){
  var css=document.getElementById("site-css").textContent, js=document.getElementById("site-js").textContent;
  var title=st.example?"Prosjektportefølje":(st.site.name||"Prosjektportefølje");
  var json=JSON.stringify(st).replace(/</g,"\\u003c").split(String.fromCharCode(8232)).join("\\u2028").split(String.fromCharCode(8233)).join("\\u2029");
  return'<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>'+esc(title)+'</title>\n'+FONTS+
    '<style id="site-css">'+css+'</style>\n<div id="app"></div>\n'+
    '<script type="application/json" id="site-data">'+json+'<\/script>\n'+
    '<script id="site-js">'+js+'<\/script>\n</body></html>';
}
function save(){
  if(saving||!dirty)return;
  if(!artifactNs){status("Lagring er ikke tilgjengelig i denne visningen. Åpne siden i Claude for å lagre.","err");return;}
  var st=JSON.parse(JSON.stringify(state));st.example=false;st.site.updated=new Date().toISOString().slice(0,10);
  var html=buildDocument(st);
  saving=true;ed.classList.add("busy");status("Publiserer …","warn");
  artifactNs.publish(html).then(function(){dirty=false;status("Publisert. Siden lastes inn på nytt …","ok");},function(err){
    saving=false;ed.classList.remove("busy");var c=err&&err.code;
    if(c==="conflict")status("Siden ble endret et annet sted samtidig og lastes inn på nytt. Endringene dine her gikk tapt.","err");
    else if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="capability_disabled"||c==="capability_removed"||c==="not_declared")status("Du har ikke tilgang til å lagre denne siden.","err");
    else if(c==="too_large")status("Siden er for stor. Fjern noen bilder og prøv igjen.","err");
    else if(c==="rate_limited")status("For mange lagringer på kort tid. Vent litt og prøv igjen.","err");
    else status("Lagringen feilet. Prøv igjen om litt.","err");
    updateBar();
  });
}
window.addEventListener("beforeunload",function(e){if(dirty&&!saving){e.preventDefault();e.returnValue="";}});

/* ---------- start ---------- */
route();
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("artifact").then(function(a){artifactNs=a;}).catch(function(){});
  window.claude.use("assets").then(function(a){assetsNs=a;refreshAssetUse();}).catch(function(){});
  window.claude.use("user").then(function(u){return u?u.canEdit():false;}).then(function(ok){if(ok){canWrite=true;render(true);}}).catch(function(){});
}
})();
</script>
</body></html>
